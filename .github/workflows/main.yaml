name: Run Quantum Benchmark

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-hhl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10" # Or whichever version you prefer

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install qiskit qiskit-ibm-runtime numpy

    - name: Execute benchmark script
      env:
        # This pulls the secret securely and passes it to your script
        QISKIT_IBM_TOKEN: ${{ secrets.QISKIT_IBM_TOKEN }}
      run: |
        python hhlt_test.py